<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
  <defs>
    <style>
      .t { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 700; font-size: 16px; fill: #134E4A; }
      .pill { animation: bob 3s ease-in-out infinite; }
      .p2 { animation: bob 3s ease-in-out 0.4s infinite; }
      .p3 { animation: bob 3s ease-in-out 0.8s infinite; }
      .p4 { animation: bob 3s ease-in-out 1.2s infinite; }
      .p5 { animation: bob 3s ease-in-out 1.6s infinite; }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </defs>
  <rect width="900" height="90" rx="18" fill="#042F2E"/>
  <g class="pill">
    <rect x="24" y="24" width="140" height="42" rx="21" fill="#0F9B8E"/>
    <text class="t" x="94" y="51" text-anchor="middle" fill="#ECFDF9">GPay</text>
  </g>
  <g class="p2">
    <rect x="184" y="24" width="140" height="42" rx="21" fill="#14B8A6"/>
    <text class="t" x="254" y="51" text-anchor="middle" fill="#042F2E">PhonePe</text>
  </g>
  <g class="p3">
    <rect x="344" y="24" width="140" height="42" rx="21" fill="#2DD4BF"/>
    <text class="t" x="414" y="51" text-anchor="middle" fill="#042F2E">Paytm</text>
  </g>
  <g class="p4">
    <rect x="504" y="24" width="140" height="42" rx="21" fill="#5EEAD4"/>
    <text class="t" x="574" y="51" text-anchor="middle" fill="#042F2E">BHIM</text>
  </g>
  <g class="p5">
    <rect x="664" y="24" width="210" height="42" rx="21" fill="#99F6E4"/>
    <text class="t" x="769" y="51" text-anchor="middle" fill="#042F2E">Any UPI App &</text>
  </g>
</svg>
