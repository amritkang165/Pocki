<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F9B8E"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <style>
      .label { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 700; fill: #0F766E; font-size: 15px; }
      .box { fill: #ECFDF9; stroke: #99F6E4; stroke-width: 2; }
      .dot { animation: dash 2.2s linear infinite; }
      @keyframes dash {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <rect width="900" height="160" rx="20" fill="#F0FDFA"/>

  <rect class="box" x="30" y="45" width="170" height="70" rx="16"/>
  <text class="label" x="115" y="87" text-anchor="middle">UPI Screenshot</text>

  <path class="dot" d="M210 80 H280" stroke="url(#flow)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" fill="none"/>

  <rect class="box" x="290" y="45" width="140" height="70" rx="16"/>
  <text class="label" x="360" y="87" text-anchor="middle">OCR Magic</text>

  <path class="dot" d="M440 80 H510" stroke="url(#flow)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" fill="none"/>

  <rect class="box" x="520" y="45" width="160" height="70" rx="16"/>
  <text class="label" x="600" y="87" text-anchor="middle">Clean Expense</text>

  <path class="dot" d="M690 80 H760" stroke="url(#flow)" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round" fill="none"/>

  <rect class="box" x="770" y="45" width="100" height="70" rx="16"/>
  <text class="label" x="820" y="87" text-anchor="middle">Insights</text>
</svg>
